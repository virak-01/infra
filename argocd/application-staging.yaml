# Argo CD Application for STAGING. Apply this to the Argo CD running in the
# staging cluster:
#
#   kubectl config use-context <staging>
#   kubectl apply -f argocd/application-staging.yaml
#
# `server: https://kubernetes.default.svc` means "the cluster I am running in",
# so this file needs no cluster registration and no credentials. If you instead
# run one Argo CD that manages both clusters, register staging with
# `argocd cluster add <context>` and put its API URL here.
#
# argocd/ is not part of the synced path — Argo CD does not manage its own
# Application, so this file is applied once by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Distinct from prod's `company-web`, so the two never collide if both
  # clusters are later managed by a single Argo CD.
  name: company-web-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/virak-01/infra.git
    targetRevision: main
    path: k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: company

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # Manual for now, matching prod — a first sync against a cluster that
    # already has resources can delete things you meant to keep, and that is
    # worth seeing in a diff once.
    #
    # Staging is the right place to turn automation on first, though: it is the
    # environment whose whole job is catching this before prod does. Once the
    # first sync is clean, uncomment:
    #
    #   automated:
    #     prune: true      # delete resources removed from git
    #     selfHeal: true   # revert manual kubectl changes
