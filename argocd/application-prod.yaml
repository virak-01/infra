# Argo CD Application for PRODUCTION: keeps the `company` namespace matching
# k8s/overlays/prod in this repo. Staging is a separate cluster with its own
# Argo CD — see application-staging.yaml.
#
# Apply this AFTER installing Argo CD itself (see docs/argocd.md), against the
# prod cluster's context. Note that argocd/ is not part of the synced path —
# Argo CD does not manage its own Application here, so this file is applied
# once by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: company-web
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/virak0001/bubernetes.git
    targetRevision: main
    # An overlay, not the raw manifest directory: k8s/base renders images
    # untagged, so only an overlay describes something deployable. Argo CD
    # detects the kustomization.yaml and renders it — no plugin config needed.
    path: k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: company

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # Sync is deliberately MANUAL: no `automated:` block.
    #
    # Argo CD's job is making the cluster match git, and git says the Services
    # are ClusterIP. The NodePort currently serving traffic exists only in the
    # cluster, so the first sync will remove it. Manual sync means you see that
    # in the diff and decide, instead of finding out from a dead URL.
    #
    # Once the Ingress serves your users and the repo describes what is really
    # running, enable automation:
    #
    #   automated:
    #     prune: true      # delete resources removed from git
    #     selfHeal: true   # revert manual kubectl changes
