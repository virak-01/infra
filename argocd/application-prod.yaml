# Argo CD Application for PRODUCTION: keeps the `prod` namespace matching
# k8s/overlays/prod in this repo. UAT shares this cluster in its own namespace
# and is managed by the same Argo CD — see application-uat.yaml.
#
# Apply this AFTER installing Argo CD itself (see docs/argocd.md). Note that
# argocd/ is not part of the synced path — Argo CD does not manage its own
# Application here, so this file is applied once by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Named for the environment it syncs, matching `destination.namespace` below
  # and `ENV` in the Makefile — see application-uat.yaml for its twin.
  name: prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/virak0001/bubernetes.git
    targetRevision: main
    # An overlay, not the raw manifest directory: k8s/base renders images
    # untagged, so only an overlay describes something deployable. Argo CD
    # detects the kustomization.yaml and renders it — no plugin config needed.
    path: k8s/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    # Matches the overlay's own `namespace: prod`. It has to: this is the
    # namespace CreateNamespace=true would create, and the default for any
    # resource that does not name one itself.
    namespace: prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # Sync is deliberately MANUAL: no `automated:` block. ../application-uat.yaml
    # has selfHeal on, on purpose — UAT proves the sync is clean before prod
    # inherits it.
    #
    # The reason this used to give is now obsolete and worth correcting rather
    # than deleting: it said git described ClusterIP Services while the cluster
    # ran NodePort, so a first sync would remove the NodePort and kill the URL.
    # Git now describes NodePort — k8s/components/ingress-alb sets it, because
    # the ALB targets node ports — so that particular trap is gone.
    #
    # What keeps this manual is narrower: nobody has yet run one clean
    # `make diff ENV=prod` against the live cluster. Turning selfHeal on makes
    # the FIRST action a forced convergence to git, and any deliberate manual fix
    # in prod disappears without appearing in a diff first. Do that once:
    #
    #   make diff ENV=prod        # expect no surprises
    #
    # then uncomment:
    #
    #   automated:
    #     selfHeal: true
    #
    # Leave `prune` off unless you specifically want git deletions to delete
    # running workloads — see ../application-uat.yaml for why.

  # THE HPA OWNS THE REPLICA COUNT, git only sets a floor.
  #
  # k8s/base/web/deployment.yaml declares `replicas: 2` so a cluster without
  # metrics-server still runs two pods. The HorizontalPodAutoscaler then moves the
  # live count to whatever load requires. Argo CD sees the difference between git
  # and the cluster and reports the Application permanently OutOfSync — and with
  # selfHeal on it would actively scale the Deployment back down, fighting the HPA
  # every reconcile loop and undoing a scale-out during exactly the traffic spike
  # that caused it.
  #
  # Ignoring the field is the documented fix and it does not weaken anything: git
  # still owns the floor, the HPA still owns the operating value.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
