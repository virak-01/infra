# Argo CD Application for UAT:
#
#   kubectl apply -f argocd/application-uat.yaml
#
# UAT and prod share a cluster now, so one Argo CD manages both and both
# Applications are applied to it. `server: https://kubernetes.default.svc`
# means "the cluster I am running in", so neither needs cluster registration
# or credentials.
#
# argocd/ is not part of the synced path — Argo CD does not manage its own
# Application, so this file is applied once by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Named for the environment it syncs, matching `destination.namespace` below
  # and `ENV` in the Makefile. Both Applications live in the same Argo CD, so
  # the names must differ — and this way the UI reads `uat` / `prod` rather
  # than one name plus a suffixed variant of it.
  name: uat
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/virak0001/bubernetes.git
    targetRevision: main
    path: k8s/overlays/uat

  destination:
    server: https://kubernetes.default.svc
    # Matches the overlay's own `namespace: uat`. It has to: this is the
    # namespace CreateNamespace=true would create, and the default for any
    # resource that does not name one itself.
    namespace: uat

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      # Revert manual kubectl changes, so the cluster cannot drift away from git
      # without someone noticing. UAT goes first deliberately: it is the
      # environment whose job is catching this before prod does.
      selfHeal: true

      # prune is deliberately LEFT OFF, here and in prod.
      #
      # selfHeal only corrects resources git still describes; prune DELETES the
      # ones it no longer does. That is the half that can take something down,
      # and this repo has a live example of why: commenting a service out of
      # k8s/base/kustomization.yaml is meant to be a one-line switch, and with
      # prune on it becomes a one-line deletion of a running workload. Enable it
      # once you want that, and know that is what you are enabling.
      #
      #   prune: true
      # prune: true

  # THE HPA OWNS THE REPLICA COUNT, git only sets a floor.
  #
  # k8s/base/web/deployment.yaml declares `replicas: 2` so a cluster without
  # metrics-server still runs two pods. The HorizontalPodAutoscaler then moves the
  # live count to whatever load requires. Argo CD sees the difference between git
  # and the cluster and reports the Application permanently OutOfSync — and with
  # selfHeal on it would actively scale the Deployment back down, fighting the HPA
  # every reconcile loop and undoing a scale-out during exactly the traffic spike
  # that caused it.
  #
  # Ignoring the field is the documented fix and it does not weaken anything: git
  # still owns the floor, the HPA still owns the operating value.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
