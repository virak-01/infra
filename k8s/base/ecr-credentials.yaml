# ECR pull credentials for clusters with no AWS-native credential provider
# (k3s, kubeadm, anything off EKS).
#
# ECR has no long-lived registry password. `aws ecr get-login-password` mints a
# token that dies after 12 hours, so a Secret created by hand works today and
# fails tomorrow — and only for pods that happen to restart, which makes it look
# intermittent. This CronJob re-mints it every 8 hours, leaving 4 hours of slack
# for a failed run to retry before anything expires.
#
# ON EKS, DELETE THIS FILE and its entry in kustomization.yaml: grant the node
# role AmazonEC2ContainerRegistryReadOnly instead. The kubelet then mints a token
# per pull, nothing is stored, and nothing can go stale.
#
# The Secret must exist before the first pod pulls — the CronJob only keeps it
# fresh, it does not bootstrap it. Run `make ecr-secret` once after deploying.
#
# The job's AWS credentials must come from a Secret named `aws-ecr-credentials`
# holding AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY:
#
#   kubectl -n company create secret generic aws-ecr-credentials \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
#
# Not the EC2 instance profile. networkpolicy-egress.yaml blocks 169.254.169.254
# on purpose — stopping a compromised container from reading the node's IAM role
# is the single most valuable rule in this namespace — and the NetworkPolicy
# below keeps that block in place for this job too. An IAM user scoped to
# ecr:GetAuthorizationToken is the trade: a narrow, revocable credential instead
# of a hole in the metadata firewall.
#
# Nothing here is committed, so this file is safe to read.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-credentials-refresh
---
# Deliberately two rules: RBAC ignores resourceNames on `create` (there is no
# name to match before the object exists), so `create` is unrestricted while
# every verb that touches an existing object is pinned to ecr-creds. Without the
# split, this would be permission to read every Secret in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-credentials-refresh
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-creds"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-credentials-refresh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-credentials-refresh
subjects:
  - kind: ServiceAccount
    name: ecr-credentials-refresh
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-credentials-refresh
spec:
  schedule: "0 */8 * * *"
  # A backed-up run must not stack: two jobs writing the same Secret race, and
  # the loser can leave a half-applied object behind.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          # Selected by the NetworkPolicy below. Without a label the blanket
          # deny-all-egress applies and every run fails on a network timeout.
          labels:
            job: ecr-credentials-refresh
        spec:
          serviceAccountName: ecr-credentials-refresh
          restartPolicy: OnFailure

          # Satisfies the `restricted` Pod Security Standard, which the namespace
          # currently warns on and may later enforce. fsGroup is the load-bearing
          # one: without it the emptyDir below is root-owned and an unprivileged
          # UID cannot write the token into it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault

          volumes:
            # Memory-backed: the token is a credential and never reaches disk.
            - name: token
              emptyDir:
                medium: Memory
            # Both images expect a writable HOME — the AWS CLI for its config
            # lookup, kubectl for its discovery cache. Neither can write to the
            # image default once running as an arbitrary UID.
            - name: home
              emptyDir: {}

          # Split across two containers because no official image carries both
          # the AWS CLI and kubectl, and pulling some third-party image that does
          # would mean trusting it with registry credentials.
          initContainers:
            - name: mint-token
              image: amazon/aws-cli:2.17.0
              command: ["/bin/sh", "-c"]
              args:
                - set -eu; aws ecr get-login-password --region "$AWS_REGION" > /token/password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: AWS_REGION
                  value: us-east-1
                - name: HOME
                  value: /home/nonroot
              envFrom:
                # optional so `kubectl apply` succeeds before the Secret is
                # created; the job then fails loudly at runtime rather than the
                # pod being stuck Pending with no explanation.
                - secretRef:
                    name: aws-ecr-credentials
                    optional: true
              volumeMounts:
                - name: token
                  mountPath: /token
                - name: home
                  mountPath: /home/nonroot
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {cpu: 200m, memory: 256Mi}

          containers:
            - name: write-secret
              image: bitnami/kubectl:1.30.5
              command: ["/bin/sh", "-c"]
              args:
                # create --dry-run | apply is the idempotent form: plain `create`
                # fails once the Secret exists, and `delete` then `create` leaves
                # a window where pulls have no credential at all.
                - |
                  set -eu
                  kubectl create secret docker-registry ecr-creds \
                    --docker-server="$ECR_REGISTRY" \
                    --docker-username=AWS \
                    --docker-password="$(cat /token/password)" \
                    --dry-run=client -o yaml \
                    | kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: ECR_REGISTRY
                  value: 043309361013.dkr.ecr.us-east-1.amazonaws.com
                - name: HOME
                  value: /home/nonroot
              volumeMounts:
                - name: token
                  mountPath: /token
                - name: home
                  mountPath: /home/nonroot
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 200m, memory: 128Mi}
---
# Narrow egress exception for the refresh job only.
#
# NetworkPolicies are additive: deny-all-egress selects every pod and permits
# nothing, and this permits a little back for pods carrying the job label. The
# site pods are untouched and still have no egress at all.
#
# The `except` is the point. 0.0.0.0/0 on 443 is broad because ECR's API
# endpoint has no stable address worth pinning, but 169.254.169.254 stays
# unreachable — so this job can call ECR while still being unable to read the
# node's IAM role from the metadata service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecr-credentials-refresh-egress
spec:
  podSelector:
    matchLabels:
      job: ecr-credentials-refresh
  policyTypes:
    - Egress
  egress:
    # Resolve api.ecr.<region>.amazonaws.com and kubernetes.default.svc.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 443 reaches the ECR API and the in-cluster API service; 6443 covers
    # clusters (k3s, kubeadm) whose API server listens there directly.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
