# The user site. Mirror of ../employee — see that file for why each field is
# here; only the three per-site values differ.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../web

namePrefix: user-

labels:
  - pairs:
      app: user-web
    includeSelectors: true

images:
  - name: web
    newName: user-web

patches:
  - path: patch-probes.yaml

  # See ../employee/kustomization.yaml for why this is per-Service.
  - target:
      kind: Service
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          alb.ingress.kubernetes.io/healthcheck-path: /user/
