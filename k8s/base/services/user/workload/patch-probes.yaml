# See ../employee/patch-probes.yaml for the reasoning. The base path must match
# this site's Ingress path, and appear identically in both places below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: nginx
          env:
            - name: NUXT_APP_BASE_URL
              value: /user/
          startupProbe:
            httpGet:
              path: /user/
          readinessProbe:
            httpGet:
              path: /user/
          livenessProbe:
            httpGet:
              path: /user/
