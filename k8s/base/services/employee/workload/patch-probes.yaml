# Everything that makes this site "the employee site" rather than the user one.
#
# It lives here, not in an overlay, because it is a property of the workload —
# true in every environment. Overlays carry only what differs between
# environments: image tag and replica count.
#
# This is the ROOT site: it answers on / rather than under a prefix.
#
# NUXT_APP_BASE_URL is still set explicitly. / is Nuxt's default, but stating it
# keeps this file the single place the mount point is declared — and it must
# agree with the Ingress path in ../kustomization.yaml and the healthcheck paths
# in ./kustomization.yaml, because the Ingress does not rewrite: whatever prefix
# the ALB matched arrives at the app intact.
#
# ../user is the counter-example — it keeps /user/ and shows the prefixed shape.
#
# Targets the pre-namePrefix name (`web`): patches apply while the resource
# still carries the template's name, before namePrefix runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: nginx
          env:
            - name: NUXT_APP_BASE_URL
              value: /
          startupProbe:
            httpGet:
              path: /
          readinessProbe:
            httpGet:
              path: /
          livenessProbe:
            httpGet:
              path: /
