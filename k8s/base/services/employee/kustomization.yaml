# employee — one line in ../../kustomization.yaml switches this service
# on or off, workload AND route together.
#
# A Component, not a Kustomization: components may patch resources the
# PARENT owns, which is what lets this file append its own path to
# ../../ingress.yaml. A plain `resources:` entry cannot reach it.
#
# Note what is NOT here: namePrefix, labels, images. A component's name
# and label transformers apply to every resource accumulated so far —
# including the parent's Ingress, Namespace and NetworkPolicies, which
# would all be renamed. They stay scoped inside workload/ for that reason.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - workload

patches:
  - target:
      kind: Ingress
    patch: |
      # The ROOT site. `/` as a Prefix matches every request on this host,
      # including /user and anything a future service claims — it is safe only
      # because the ALB controller orders listener rules by path specificity,
      # not by the order paths appear here. /user (5 chars) and /api (4) both
      # beat / (1), so this acts as the fallback rather than a black hole.
      #
      # A service mounted at root must therefore be the LAST resort on its
      # host. Only one service per host can hold /.
      - op: add
        path: /spec/rules/0/http/paths/-
        value:
          path: /
          pathType: Prefix
          backend:
            service:
              name: employee-web
              port:
                number: 80
