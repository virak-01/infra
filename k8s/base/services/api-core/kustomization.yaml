# api-core — one line in ../../kustomization.yaml switches this service
# on or off, workload AND route together.
#
# A Component, not a Kustomization: components may patch resources the
# PARENT owns, which is what lets this file append its own path to
# ../../ingress.yaml. A plain `resources:` entry cannot reach it.
#
# Note what is NOT here: namePrefix, labels, images. A component's name
# and label transformers apply to every resource accumulated so far —
# including the parent's Ingress, Namespace and NetworkPolicies, which
# would all be renamed. They stay scoped inside workload/ for that reason.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - workload

patches:
  - target:
      kind: Ingress
    patch: |
      # ONE rule for every route this service owns.
      #
      # `pathType: Prefix` on /api already matches /api/learn, /api/blog and
      # anything added later — Kubernetes has no wildcard syntax and needs none.
      # Listing each controller separately meant a new controller in api-ops was
      # unreachable until someone remembered to add a line here.
      #
      # This is the CATCH-ALL for the api host, and it coexists with api-auth's
      # /api/auth and /api/health on the same rule because the Ingress spec
      # awards a request to the LONGEST matching path. /api/auth (9 chars) beats
      # /api (4), so auth keeps its traffic and everything else lands here.
      #
      # The consequence, and it is the reverse of the old arrangement: a NEW
      # api-auth route is NOT automatically routed — it falls here and 404s from
      # api-core. New auth routes need a line in ../api-auth; new core routes
      # need nothing.
      - op: add
        path: /spec/rules/1/http/paths/-
        value:
          path: /api
          pathType: Prefix
          backend:
            service:
              name: api-core-web
              port:
                number: 80
