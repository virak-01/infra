apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-allow-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - employee-web
          - user-web

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

    # Optional: allow kubelet/node traffic if needed
    # - from:
    #     - ipBlock:
    #         cidr: 172.31.0.0/16
    #   ports:
    #     - protocol: TCP
    #       port: 3000