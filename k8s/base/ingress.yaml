apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: company-web
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /employee(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: employee-web
                port:
                  number: 80

          - path: /user(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-web
                port:
                  number: 80