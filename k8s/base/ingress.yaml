# Single Ingress fronting both sites:
#   http://<address>/employee  -> employee-web
#   http://<address>/user      -> user-web
#
# Targets the community ingress-nginx controller, which must be installed in
# the cluster — see docs/deployment.md. No rewrite annotations are needed:
# each image already serves its files under the matching subpath.
#
# To move back to the AWS Load Balancer Controller on EKS, set ingressClassName
# to "alb" and restore its annotations:
#   alb.ingress.kubernetes.io/scheme: internet-facing
#   alb.ingress.kubernetes.io/target-type: ip
#   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
#   alb.ingress.kubernetes.io/healthcheck-path: /
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: company-web
  namespace: company
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /employee
            pathType: Prefix
            backend:
              service:
                name: employee-web
                port:
                  number: 80
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: user-web
                port:
                  number: 80
