apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: company-web
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # `instance`, not `ip`. `ip` registers pod addresses directly with the
    # target group, which needs VPC-routable pod IPs — the AWS VPC CNI. This
    # cluster runs Calico, an overlay CNI whose pod addresses exist only inside
    # the cluster, so the ALB cannot reach them. `instance` targets the node's
    # NodePort instead, which is why the Services below must be NodePort.
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Fallback only. One target group is created per backend Service, and each
    # site serves under its own subpath — so /employee is a 404 on user-web.
    # Each Service carries its own healthcheck-path annotation, which takes
    # priority over this one; see k8s/base/employee/kustomization.yaml.
    alb.ingress.kubernetes.io/healthcheck-path: /employee/
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /employee
            pathType: Prefix
            backend:
              service:
                name: employee-web
                port:
                  number: 80
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: user-web
                port:
                  number: 80
