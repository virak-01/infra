apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: company-web
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # `instance`, not `ip`. `ip` registers pod addresses directly with the
    # target group, which needs VPC-routable pod IPs — the AWS VPC CNI. This
    # cluster runs Calico, an overlay CNI whose pod addresses exist only inside
    # the cluster, so the ALB cannot reach them. `instance` targets the node's
    # NodePort instead, which is why the Services below must be NodePort.
    alb.ingress.kubernetes.io/target-type: instance
    # Port 80 stays listed. ssl-redirect works by installing a redirect action
    # on the HTTP listener, so removing 80 leaves nothing to redirect from and
    # plain-HTTP links fail instead of upgrading.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # A wildcard cert covering the apex + *.devops-selft-learning.xyz, so uat
    # and prod share it. Set explicitly rather than relying on the controller's
    # host-based auto-discovery, which has nothing to match while the overlay
    # hosts are commented out.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:043309361013:certificate/43fc6440-d2d6-4b46-b86d-bafab7378765
    # Fallback only. One target group is created per backend Service, and each
    # site serves under its own subpath — so /employee is a 404 on user-web.
    # Each Service carries its own healthcheck-path annotation, which takes
    # priority over this one; see k8s/base/employee/kustomization.yaml.
    alb.ingress.kubernetes.io/healthcheck-path: /employee/
spec:
  ingressClassName: alb
  rules:
    # TWO RULES, AND THEIR ORDER IS AN API.
    #
    # Both start with no paths and no host. Each service component appends its
    # own path to the rule that matches its hostname, and each overlay sets the
    # two hosts — so a service and its route are still switched on by one line
    # in ../kustomization.yaml.
    #
    #   rules[0]  the browser-facing sites   /employee  /user
    #   rules[1]  the APIs                   /api/*
    #
    # The index is referenced by name in three other places: both service
    # components patch `/spec/rules/<n>/http/paths/-`, each overlay patches
    # `/spec/rules/<n>/host`, and `make deploy HOST=` patches rules/0/host.
    # Inserting a rule rather than appending one silently re-points all of them.
    #
    # Splitting the APIs onto their own host is what allows them to keep their
    # natural paths: /api/auth is unambiguous under api.<domain>, where under a
    # single host it had to coexist with every other service's /api/*.
    #
    # Hosts live in the overlays, not here. uat and prod share one cluster, so
    # an identical host in both would be claimed by whichever Ingress was
    # created first — silently, with no error on either object.
    #
    # A rule that renders with zero paths is rejected by the API server. That is
    # the intended failure: an Ingress routing nothing is not worth deploying.
    - http:
        paths:
          []
    - http:
        paths:
          []
