# One Namespace definition, rendered once per environment.
#
# `name` is a placeholder and is never applied as written: kustomize's
# namespace transformer renames a Namespace object to whatever the overlay
# declares, so ../overlays/uat renders this as `uat` and ../overlays/prod as
# `prod`. Edit the labels here and both environments get them.
apiVersion: v1
kind: Namespace
metadata:
  name: placeholder
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
