# One environment's whole namespace, environment-independent.
#
# Not applied directly, for two reasons now: the two site images render
# untagged here, and there is deliberately no namespace (see below), so the
# Namespace object would render under its placeholder name. Deploy an overlay
# (../overlays/uat, ../overlays/prod) instead. `kubectl kustomize k8s/base` is
# still the quickest way to see the shared shape.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` here on purpose — it belongs to the overlay.
#
# uat and prod share one cluster and are told apart by namespace, so the
# namespace IS the environment. Setting it here would pin every environment to
# the same one. Each overlay declares its own, which kustomize then stamps onto
# every resource below AND uses to rename namespace.yaml's Namespace object, so
# one file serves both environments.

resources:
  - namespace.yaml
  - ingress.yaml
  - networkpolicy-egress.yaml
  - networkpolicy-ingress.yaml
  # Drop this line on EKS — the node role supplies pull credentials there.
  - ecr-credentials.yaml

# THE SERVICE LIST. One line per service, and the only place a service is
# switched on or off — comment a line and its Deployment, Service, HPA, PDB and
# its Ingress path all disappear together. Adding one is the mirror image:
# copy a directory under services/ and add it here.
#
# These are components rather than resources because only a component can patch
# a resource the parent owns, which is how each service appends its own path to
# ingress.yaml. That coupling is the point: a route can never outlive the
# workload it points at.
#
# Removing a line stops the resource being RENDERED; it does not delete what is
# already running. `kubectl apply` never prunes. Follow with either
#   argocd app sync <env> --prune
# or `kubectl -n <env> delete deploy,svc,hpa,pdb -l app=<service>`.
# ORDER: broadest last, within a rule. api-core owns /api and api-auth owns the
# longer /api/auth and /api/health beneath it — all three on rules[1].
#
# employee is the exception and its position here changes nothing: it patches
# rules[0], a different rule, so its bare / never shares a path list with /api.
# What keeps those two apart is the HOST — rules[0] is the site, rules[1] is the
# API. While the overlay host patches are commented out both rules are hostless
# and / is a catch-all in front of everything, which is safe only because the
# ALB controller orders listener rules by path specificity. Enabling the hosts
# removes the reliance on that entirely.
components:
  # - services/user
  - services/api-core
  - services/api-auth
  - services/employee

# Provenance labels only. includeSelectors is false — and must stay false:
# these keys would otherwise land in the Deployments' immutable selectors and
# break every apply against the running objects.
labels:
  - pairs:
      app.kubernetes.io/part-of: company-web
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
