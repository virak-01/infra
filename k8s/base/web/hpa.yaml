# Scales on CPU, which is the binding resource for server-side rendering.
#
# REQUIRES metrics-server in the cluster. Without it the HPA reports
# <unknown>/70% and never scales — it will not scale to zero, so the
# Deployment's replicas: 2 remains the floor. Install it before relying on this:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# 70% of the 200m CPU request, so a pod is considered saturated around 140m and
# a second one is added before latency degrades. Overlays patch minReplicas and
# maxReplicas per environment.
#
# scaleDown is deliberately slow: SSR traffic is spiky, and the default 5-minute
# window still removes capacity fast enough to cause a second scale-up moments
# later. Scaling up is left at the default — fast is correct there.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
