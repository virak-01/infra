# Placeholder name/selector, same as the Deployment: the per-site kustomization
# renames this to <site>-web and rewrites the selector to match its pods.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  # NodePort is required by the Ingress's `target-type: instance`: the ALB
  # registers nodes and reaches this Service through its node port, which a
  # ClusterIP Service does not have.
  #
  # Not LoadBalancer. That would ask for a second load balancer per site,
  # bypassing the ALB the Ingress already builds — and nothing on a kubeadm
  # cluster fulfils it, so it would sit at EXTERNAL-IP <pending> forever.
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
