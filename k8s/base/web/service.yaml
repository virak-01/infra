# Placeholder name/selector, same as the Deployment: the per-site kustomization
# renames this to <site>-web and rewrites the selector to match its pods.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  # ClusterIP is the portable default: an in-cluster ingress controller reaches
  # pods directly and needs nothing more.
  #
  # AWS is the exception and overrides this to NodePort in
  # ../../components/aws, because the ALB is registered against nodes
  # (`target-type: instance`) and a ClusterIP Service has no node port for it to
  # reach. Stated explicitly rather than omitted so that override is a `replace`
  # on a field that exists, and so the two clouds' choices read side by side.
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
