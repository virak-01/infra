# The shared shape of a static-site Deployment. Both sites were byte-identical
# here except for name, image, and probe path, so those three live in the
# per-site kustomizations (../employee, ../user) and everything else lives once.
#
# `name` and the `app` label are placeholders: each site's kustomization applies
# a namePrefix and a label transformer, so nothing named `web` is ever applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  # A floor, not the operating value: the HorizontalPodAutoscaler owns the
  # replica count once metrics-server is available. Kept here so that a cluster
  # without metrics-server still runs two pods rather than defaulting to one.
  #
  # Consequence worth knowing: every `kubectl apply` resets the count to 2, so a
  # deploy while scaled out causes a brief dip before the HPA recovers. Argo CD
  # users should add `ignoreDifferences` on /spec/replicas to avoid permanent
  # OutOfSync noise.
  replicas: 2

  # Zero-downtime rollout: never drop below the desired count, add one pod at a
  # time. The default (25% unavailable) can take half the fleet out at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Give in-flight SSR renders time to finish. The preStop sleep below eats
      # into this, so it must comfortably exceed it.
      terminationGracePeriodSeconds: 30

      # Both pods of a site must not share a node, or a single node failure
      # takes the whole site down. ScheduleAnyway rather than DoNotSchedule:
      # on a one-node cluster the pod still schedules instead of hanging
      # Pending, which matters while this runs on kubeadm.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web

      # runAsUser must be numeric and must be stated here. `runAsNonRoot: true`
      # alone fails when the image declares `USER nuxt`: the kubelet cannot
      # resolve a name to a UID without running the image, so it refuses to
      # start — "image has non-numeric user (nuxt), cannot verify user is
      # non-root". 1001 matches the UID pinned in the frontend Dockerfile; the
      # two must be changed together.
      #
      # readOnlyRootFilesystem is NOT set: Nitro writes to a temp dir at
      # runtime. Adding it needs an emptyDir at /tmp and a test, not a guess.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # This pod serves static files and never calls the Kubernetes API, so it
      # has no use for a service account token. Not mounting one means a
      # container compromise yields no cluster credential.
      automountServiceAccountToken: false

      # Private ECR. On EKS this line is unnecessary — the kubelet's credential
      # provider handles it from the node role — but harmless: a missing Secret
      # only logs an event, and the node credentials still satisfy the pull.
      # See ../ecr-credentials.yaml for how this Secret stays valid.
      imagePullSecrets:
        - name: ecr-creds

      # Worker nodes only. No toleration for the control-plane taint is
      # declared either, so these pods can never land on a master.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      containers:
        - name: nginx
          # Untagged on purpose. Each site's kustomization rewrites the name
          # (`web` -> <ecr-registry>/<site>-web) and the overlay pins the tag, so an
          # overlay is the only thing that renders a deployable image ref.
          image: web
          # The app is a Node server (Nitro), which listens on 3000. The port's
          # *name* is the contract: the Service targets `http`, not a number,
          # and both probes reference it — so this number can change without
          # touching anything else.
          ports:
            - name: http
              containerPort: 3000

          # Environment-varying app config. Each overlay generates this
          # ConfigMap, so kustomize appends a content hash to its name and
          # rewrites this reference — changing a value therefore changes the pod
          # template and rolls the pods. A hand-written ConfigMap would not:
          # edits would apply only to pods that happened to restart later.
          #
          # Per-site values (NUXT_APP_BASE_URL) stay in ../<site>/patch-probes.yaml
          # instead, because they do not vary by environment.
          envFrom:
            - configMapRef:
                name: website-config
          # Sized for a Node SSR process, not for nginx serving static files.
          # The previous 64Mi limit was below Node's own baseline heap (~50-80Mi
          # before rendering anything), so pods OOMKilled under any real load.
          #
          # The CPU request is what the HPA divides by, so it sets the scaling
          # point as well as the scheduling one — lowering it makes the HPA
          # scale out later, not sooner.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: SSR is bursty, and a limit throttles
              # p99 latency for no isolation benefit once requests are set.
              memory: 512Mi

          # Cold start can take tens of seconds under load. Without a
          # startupProbe the liveness probe applies from the beginning and
          # restarts the pod mid-boot — a crash loop that looks like a broken
          # image. This gives up to 60s (30 x 2s) before liveness takes over.
          # Path is per-site; ../<site>/patch-probes.yaml overrides it.
          startupProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 2
            failureThreshold: 30

          # Remove the pod from Service endpoints before the process starts
          # shutting down. Endpoint propagation is asynchronous, so without this
          # the ingress keeps sending requests to a terminating pod for a second
          # or two — the usual cause of 502s during an otherwise clean deploy.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Probe paths are per-site: each site patches these to the subpath the
          # Ingress actually serves, so a probe failure means the served URL is
          # broken, not merely that nginx is up.
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
