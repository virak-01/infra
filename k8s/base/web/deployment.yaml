# The shared shape of a static-site Deployment. Both sites were byte-identical
# here except for name, image, and probe path, so those three live in the
# per-site kustomizations (../employee, ../user) and everything else lives once.
#
# `name` and the `app` label are placeholders: each site's kustomization applies
# a namePrefix and a label transformer, so nothing named `web` is ever applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # This pod serves static files and never calls the Kubernetes API, so it
      # has no use for a service account token. Not mounting one means a
      # container compromise yields no cluster credential.
      automountServiceAccountToken: false

      # Private ECR. On EKS this line is unnecessary — the kubelet's credential
      # provider handles it from the node role — but harmless: a missing Secret
      # only logs an event, and the node credentials still satisfy the pull.
      # See ../ecr-credentials.yaml for how this Secret stays valid.
      imagePullSecrets:
        - name: ecr-creds

      # Worker nodes only. No toleration for the control-plane taint is
      # declared either, so these pods can never land on a master.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      containers:
        - name: nginx
          # Untagged on purpose. Each site's kustomization rewrites the name
          # (`web` -> <ecr-registry>/<site>-web) and the overlay pins the tag, so an
          # overlay is the only thing that renders a deployable image ref.
          image: web
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # Probe paths are per-site: each site patches these to the subpath the
          # Ingress actually serves, so a probe failure means the served URL is
          # broken, not merely that nginx is up.
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
