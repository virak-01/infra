# Deny all outbound traffic from every pod in the namespace.
#
# The main thing this stops is a compromised container reaching the EC2
# metadata service at 169.254.169.254 and reading the node's IAM role
# credentials — the usual path from "container compromise" to "AWS account
# compromise" on a self-managed cluster.
#
# These pods serve files off local disk: no database, no API calls, not even
# DNS. So a blanket egress denial costs nothing. If a future container ever
# does need to resolve names, add back a rule allowing UDP/TCP 53 to kube-dns.
#
# Safe to apply at any time — this constrains outbound traffic only, so it
# cannot affect inbound requests, kubelet probes, or NodePort access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  # No `egress:` rules at all means "permit nothing".
---
# Narrow egress allowance for the two web pods.
#
# deny-all-egress above selects every pod and permits nothing, which is correct
# for a static nginx site but fatal for a server-rendered app: the Nuxt server
# resolves DNS and calls the backend during SSR, so with no egress every
# /api/* render fails and the page renders empty. NetworkPolicies are additive,
# so this grants back the minimum and leaves everything else denied.
#
# 169.254.169.254 stays blocked. That exclusion is the whole point of the deny
# rule — it stops a compromised container reading the node's IAM role — and
# nothing here should ever need the metadata service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-allow-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [employee-web, user-web]
  policyTypes:
    - Egress
  egress:
    # DNS. Without this nothing else works: the pod cannot resolve a Service
    # name, and failures look like connection timeouts rather than NXDOMAIN.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # In-cluster backends (NUXT_AUTH_URL / NUXT_BACKEND_URL). Deliberately
    # scoped by port rather than left open.
    #
    # THE PORT HERE IS THE CONTAINER PORT, NOT THE SERVICE PORT.
    #
    # The Nuxt server calls http://api-auth-web, which is the Service on :80 —
    # but kube-proxy DNATs that to the backing pod's address on its targetPort
    # BEFORE Calico evaluates this rule. What the policy sees is podIP:3000, so
    # allowing 80 alone matches nothing and the connection is dropped.
    #
    # The failure gives no hint of a policy: the request simply never arrives,
    # Nuxt's SSR fetch times out, and the browser gets
    #   {"statusCode":502,"message":"Upstream request failed."}
    # which reads as a broken backend rather than a firewall.
    #
    # 3000 is every service's containerPort (k8s/base/web/deployment.yaml).
    # 80 is kept for anything that ever listens on it directly; 3001 and 3002
    # date from when the APIs were expected on their own ports and are harmless.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002

    # Outbound HTTPS, minus the metadata service. Needed if the backend is an
    # external API. Drop this rule entirely if everything it talks to is
    # in-cluster — it is the broadest thing here.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
---
# Egress for the API services.
#
# Without this they are selected by deny-all-egress above and granted nothing —
# not even DNS. The failure does not look like a firewall: TypeORM reports
#
#   Error: getaddrinfo EAI_AGAIN ep-...-pooler.<region>.aws.neon.tech
#
# which reads as a broken hostname or a DNS outage rather than a policy that
# never let the query leave the pod.
#
# Separate from web-allow-egress rather than folded into it: the sites must not
# be able to open 5432 to the internet, and these two must not inherit the
# sites' in-cluster backend ports. Each selector grants only what its own
# workload needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [api-auth-web, api-core-web]
  policyTypes:
    - Egress
  egress:
    # DNS, and it must come first in practice: every rule below is written
    # against a hostname, so without name resolution none of them are reachable.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # PostgreSQL and HTTPS to the public internet, minus the metadata service.
    #
    # The database is Neon — managed, external, reached over TLS on 5432 — so
    # this cannot be narrowed to a namespace or a Service. It is an ipBlock
    # because Neon publishes no stable address to pin.
    #
    # 169.254.169.254 stays excluded. That exclusion is the entire point of the
    # deny rule: it stops a compromised container reading the node's IAM role,
    # and it matters more here than on the static sites, since these pods hold
    # database credentials and JWT signing keys.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
