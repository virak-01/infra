# Single Ingress fronting both sites:
#   http://<address>/employee  -> employee-web
#   http://<address>/user      -> user-web
#
# Annotations below target the AWS Load Balancer Controller (EKS).
# For a plain nginx-ingress cluster, change ingressClassName to "nginx"
# and drop the alb.ingress.kubernetes.io/* annotations — no rewrite rules
# are needed either way, because each image already serves its files under
# the matching subpath.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: company-web
  namespace: company
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /employee
            pathType: Prefix
            backend:
              service:
                name: employee-web
                port:
                  number: 80
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: user-web
                port:
                  number: 80
