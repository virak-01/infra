apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# THE CLOUD. Base is cloud-neutral — routes but no ingress class, ClusterIP
# Services, no registry credentials — and this line is what makes the render
# deployable on AWS: ALB annotations, NodePort Services, the ECR pull-secret
# refresh job.
#
# MUST MATCH THE TERRAFORM STACK THAT BUILT THE CLUSTER:
#
#   ../../components/aws-kubeadm   ingress-nginx on a NodePort — no ALB controller
#   ../../components/aws           an ALB built by the AWS Load Balancer Controller
#
# ../aws IS IN USE ON THE KUBEADM STACK, which the AWS docs treat as EKS-only.
# The controller normally authenticates with IRSA — an EKS-managed OIDC provider
# — so the workaround is static IAM keys in the `aws-alb-credentials` Secret,
# plus `region` and `vpcId` passed to Helm explicitly because only EKS publishes
# the cluster metadata it would otherwise read them from. LoadBalancerConfig.md
# is the whole procedure; without it `ingressClassName: alb` is claimed by
# nothing and the Ingress sits without an address, unexplained by any log.
#
# Exactly one edge component, and ../uat must agree: the two share a cluster, and
# two ingress classes claiming the same hosts is resolved by whichever object was
# created first, silently.
#
# It lives here rather than in the Makefile because Argo CD renders this file
# straight from git and never runs make.
components:
  - ../../components/aws

namespace: prod
images:
  - name: employee-web
    newName: 866409326838.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: v1.0.0
  - name: auth
    newName: 866409326838.dkr.ecr.us-east-1.amazonaws.com/auth
    newTag: v2.0.0
  - name: core
    newName: 866409326838.dkr.ecr.us-east-1.amazonaws.com/core
    newTag: v1.0.2

patches:
  # The two production hostnames. Both need Route 53 ALIAS records pointing at
  # the ALB the Ingress builds — ALIAS and not CNAME because DNS forbids a CNAME
  # on a zone apex.
  #
  # DISABLED until those records exist. Setting a host takes prod out of the
  # catch-all position: a request arriving with any other Host header — the raw
  # ALB hostname included — then matches no rule and gets a bare 404. Uncomment
  # both ops once the records resolve, and not before.
  # - target:
  #     kind: Ingress
  #   patch: |
  #     - op: add
  #       path: /spec/rules/0/host
  #       value: devops-selft-learning.xyz
  #     - op: add
  #       path: /spec/rules/1/host
  #       value: api.devops-selft-learning.xyz

  # The default: everything runs two pods in prod.
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # needs a different replica count.
  - target:
      kind: Deployment
      name: api-core-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: api-core-web
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: api-core-web
    patch: |
      - op: remove
        path: /spec/minAvailable
      - op: add
        path: /spec/maxUnavailable
        value: 1