apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
namespace: prod
images:
  - name: employee-web
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-614b46c7
  - name: user-web
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-332218de
  - name: auth
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/auth
    newTag: v1.0.10
  - name: core
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/core
    newTag: v1.0.01

patches:
  # The default: everything runs two pods in prod.
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # needs a different replica count.
  - target:
      kind: Deployment
      name: api-core-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: api-core-web
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: api-core-web
    patch: |
      - op: remove
        path: /spec/minAvailable
      - op: add
        path: /spec/maxUnavailable
        value: 1