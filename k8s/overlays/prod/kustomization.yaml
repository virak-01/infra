apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# THE CLOUD. Base is cloud-neutral — routes but no ingress class, ClusterIP
# Services, no registry credentials — and this line is what makes the render
# deployable on AWS: ALB annotations, NodePort Services, the ECR pull-secret
# refresh job.
#
# MUST MATCH THE TERRAFORM STACK THAT BUILT THE CLUSTER:
#
#   ../../components/aws-kubeadm   terraform/infra-kubeadm — ingress-nginx, NodePort
#   ../../components/aws           terraform/infra (EKS)   — an ALB, IRSA-authenticated
#
# The ALB controller authenticates with IRSA, which only EKS provides, so on the
# kubeadm stack it is not installed and `ingressClassName: alb` is claimed by
# nothing — the Ingress sits without an address and no controller logs why.
#
# Exactly one edge component, and ../uat must agree: the two share a cluster, and
# two ingress classes claiming the same hosts is resolved by whichever object was
# created first, silently.
#
# It lives here rather than in the Makefile because Argo CD renders this file
# straight from git and never runs make.
components:
  - ../../components/aws-kubeadm

namespace: prod
images:
  - name: employee-web
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-614b46c7
  - name: user-web
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-332218de
  - name: auth
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/auth
    newTag: v1.0.10
  - name: core
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/core
    newTag: v1.0.01

patches:
  # The two production hostnames. Both need Route 53 ALIAS records pointing at
  # the ALB the Ingress builds — ALIAS and not CNAME because DNS forbids a CNAME
  # on a zone apex.
  #
  # DISABLED until those records exist. Setting a host takes prod out of the
  # catch-all position: a request arriving with any other Host header — the raw
  # ALB hostname included — then matches no rule and gets a bare 404. Uncomment
  # both ops once the records resolve, and not before.
  # - target:
  #     kind: Ingress
  #   patch: |
  #     - op: add
  #       path: /spec/rules/0/host
  #       value: devops-selft-learning.xyz
  #     - op: add
  #       path: /spec/rules/1/host
  #       value: api.devops-selft-learning.xyz

  # The default: everything runs two pods in prod.
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  # needs a different replica count.
  - target:
      kind: Deployment
      name: api-core-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: api-core-web
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: PodDisruptionBudget
      name: api-core-web
    patch: |
      - op: remove
        path: /spec/minAvailable
      - op: add
        path: /spec/maxUnavailable
        value: 1