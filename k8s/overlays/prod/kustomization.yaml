# Production. What Argo CD syncs (see argocd/application-prod.yaml).
#
# Runs on its own cluster, so it shares the `company` namespace and every
# resource name with ../staging — only the tag and the replica count differ.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Also declared here, not only in the base: resources generated by this
# overlay (the ConfigMap below) are not covered by the base's namespace
# transformer. Without it the ConfigMap lands in `default`, and kustomize
# silently refuses to rewrite the base's envFrom reference to the hashed
# name — leaving pods pointing at a ConfigMap that does not exist.
namespace: company

# The release. Bumping a tag here is the deploy — the single line a rollout
# changes, and the single line to revert.
#
# Avoid reusing a tag: nodes may keep the old cached layer, so the same tag can
# mean two different images across the fleet.
# `name` matches what the base rendered (`employee-web`, not the original
# `web`); newName prepends this environment's registry and newTag pins the
# release. A `name` that matches nothing is not an error — kustomize skips the
# entry and the image renders untagged, i.e. :latest.
images:
  - name: employee-web
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-614b46c7
  - name: user-web
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-332218de

# Stated explicitly even though it matches the base default, so that reading
# this file beside ../staging/kustomization.yaml shows the whole difference
# between the environments without having to open the base.
replicas:
  - name: employee-web
    count: 2
  - name: user-web
    count: 2
