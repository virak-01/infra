# UAT. Shares a cluster with prod and is separated from it by namespace, so
# every resource name stays identical to prod's — `ENV`, not the kubectl
# context, is what selects the environment.
#
#   make deploy ENV=uat
#
# That sameness is the point: UAT is only worth testing against if it is shaped
# like prod. The two differences that matter are below — the image tag and the
# scale — plus the Ingress host, which MUST differ (see the patch).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# THE CLOUD, matching ../prod. Base is cloud-neutral and this is what makes the
# render deployable on AWS: the ingress class, the ECR pull-secret refresh job.
#
# MUST MATCH THE TERRAFORM STACK THAT BUILT THE CLUSTER:
#
#   ../../components/aws-kubeadm   terraform/infra-kubeadm — ingress-nginx, NodePort
#   ../../components/aws           terraform/infra (EKS)   — an ALB, IRSA-authenticated
#
# The ALB controller needs IRSA, which only EKS has, so on this stack it is not
# installed and `ingressClassName: alb` would be claimed by nothing — the Ingress
# would sit without an address and no controller would log why.
#
# The two share a cluster and must agree on the ingress class, so this line and
# ../prod/kustomization.yaml's change together or not at all. Swapping only one
# leaves two controllers claiming hosts in one cluster, resolved by creation order
# and never logged.
components:
  - ../../components/aws-kubeadm

# The environment. This is the only place it is declared: the base deliberately
# sets no namespace, so this value both stamps every resource below and renames
# the base's Namespace object to `uat`.
namespace: uat

# UAT normally runs ahead of prod: bump the tag here, verify, then set the
# same tag in ../prod.
#
# TEMPORARY: both sites deliberately point at the same `website` image while the
# deployment path is being tested end to end. The per-site employee-web and
# user-web repositories do not exist in ECR yet. Two entries rather than one
# because the base still renders two distinct names — that is what lets them be
# split apart again later without touching anything else.

images:
  - name: employee-web
    newName: 866409326838.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-9ed42421
  - name: user-web
    newName: 866409326838.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-9ed42421
  - name: auth
    newName: 866409326838.dkr.ecr.us-east-1.amazonaws.com/auth
    newTag: v1.0.10
  - name: core
    newName: 866409326838.dkr.ecr.us-east-1.amazonaws.com/core
    newTag: v1.0.01

# One replica is enough to serve UAT traffic — and it also keeps the two
# environments inside one node's memory budget. Declared here rather than
# patched into the base, so the two overlays can be read side by side and the
# difference is obvious.
# Replica count is a PATCH, not the `replicas:` transformer, and the target is
# every Deployment rather than a list of names.
#
# `replicas:` names each workload, and a name matching nothing is a hard error
# ("resource with name user-web does not match a config with the following
# GVK") — unlike `images:`, which skips silently. That would make commenting a
# service out of k8s/base/kustomization.yaml break this file too, defeating the
# one-line switch. Targeting the kind keeps this overlay ignorant of which
# services exist.
#
# The cost: every service in UAT scales identically. Add a name: to a second
# patch if one ever needs its own count.

# ONE `patches:` key for the whole file. A second one does not merge and does
# not error — kustomize takes the last and silently discards the first, so the
# patch you thought you added is simply gone from the render. Add new patches
# as list items here.
patches:
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # UAT scales lower than prod. minReplicas must not exceed the replica count
  # above, or the HPA immediately scales the Deployment up and the declared
  # replica count becomes a lie.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

  # Both hosts, and both are mandatory now that ../prod claims hostnames of its
  # own. Neither environment is the catch-all any more, so a rule left hostless
  # here would answer for every unmatched Host header in the cluster — including
  # requests meant for prod — and nothing would log it.
  #
  # These must also differ from prod's. uat and prod share one cluster, and two
  # Ingresses claiming the same host are resolved by whichever object was
  # created first, silently.
  #
  # Both need Route 53 records pointing at the same ALB.
  - target:
      kind: Ingress
    patch: |
      - op: add
        path: /spec/rules/0/host
        value: uat.devops-selft-learning.xyz
      - op: add
        path: /spec/rules/1/host
        value: uat-api.devops-selft-learning.xyz
