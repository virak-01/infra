# Staging. Its own cluster, so the namespace, Ingress and every name stay
# identical to prod — the kubectl context is what selects the environment.
# That sameness is the point: staging is only worth testing against if it is
# shaped like prod.
#
#   kubectl config use-context <staging>
#   make deploy ENV=staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Also declared here, not only in the base: resources generated by this
# overlay (the ConfigMap below) are not covered by the base's namespace
# transformer. Without it the ConfigMap lands in `default`, and kustomize
# silently refuses to rewrite the base's envFrom reference to the hashed
# name — leaving pods pointing at a ConfigMap that does not exist.
namespace: company

# Staging normally runs ahead of prod: bump the tag here, verify, then set the
# same tag in ../prod.
#
# TEMPORARY: both sites deliberately point at the same `website` image while the
# deployment path is being tested end to end. The per-site employee-web and
# user-web repositories do not exist in ECR yet. Two entries rather than one
# because the base still renders two distinct names — that is what lets them be
# split apart again later without touching anything else.
images:
  - name: employee-web
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-9ed42421
  - name: user-web
    newName: 043309361013.dkr.ecr.us-east-1.amazonaws.com/website
    newTag: staging-9ed42421

# One replica is enough to serve staging traffic. Declared here rather than
# patched into the base, so the two overlays can be read side by side and the
# difference is obvious.
replicas:
  - name: employee-web
    count: 1
  - name: user-web
    count: 1

# Environment-varying app config, consumed by ../../base/web/deployment.yaml
# via envFrom. Generated rather than hand-written so the name carries a content
# hash: edit a value here and the pods roll on the next apply.
# Values come from app-config.env, which is gitignored — this file must never
# carry configuration. Copy app-config.env.example and fill it in per cluster.
#
# `envs:` keeps the generator's content hash, so editing the file still rolls
# the pods on the next apply. Reading the values from a Secret instead would
# lose that, which is the trade for anything genuinely sensitive.
#
# NUXT_PUBLIC_* is compiled into the page and served to every browser, so it is
# public by construction. Real secrets belong in a Kubernetes Secret consumed
# with envFrom.secretRef, created out of band like ecr-creds — never here.
configMapGenerator:
  - name: website-config
    envs:
      - app-config.env
