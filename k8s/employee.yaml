apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-web
  namespace: company
  labels:
    app: employee-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-web
  template:
    metadata:
      labels:
        app: employee-web
    spec:
      containers:
        - name: nginx
          image: employee-web:1.0.0
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /employee/index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /employee/index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: employee-web
  namespace: company
spec:
  type: ClusterIP
  selector:
    app: employee-web
  ports:
    - name: http
      port: 80
      targetPort: http
