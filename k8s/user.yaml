apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-web
  namespace: company
  labels:
    app: user-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-web
  template:
    metadata:
      labels:
        app: user-web
    spec:
      # Worker nodes only. No toleration for the control-plane taint is
      # declared either, so these pods can never land on a master.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      containers:
        - name: nginx
          image: user-web:1.0.0
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /user/index.html
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /user/index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-web
  namespace: company
spec:
  type: ClusterIP
  selector:
    app: user-web
  ports:
    - name: http
      port: 80
      targetPort: http
